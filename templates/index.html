<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Frete</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 40px; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Calculadora de Frete</h2>
        <form id="freteForm">
            <div class="form-group">
                <label for="valor">Valor do Carrinho (R$):</label>
                <input type="number" id="valor" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="regiao">Região:</label>
                <select id="regiao" required>
                    <option value="Norte">Norte</option>
                    <option value="Nordeste">Nordeste</option>
                    <option value="Centro-Oeste">Centro-Oeste</option>
                    <option value="Sudeste" selected>Sudeste</option>
                    <option value="Sul">Sul</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cupom">Cupom (Ex: PROMO10):</label>
                <input type="text" id="cupom">
            </div>

            <button type="submit">Calcular Total</button>
        </form>

        <div id="resultado" class="result-box"></div>
    </div>

    <script>
        document.getElementById('freteForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultBox = document.getElementById('resultado');
            resultBox.style.display = 'block';
            resultBox.className = 'result-box';
            resultBox.innerHTML = 'Processando...';

            const payload = {
                valor: parseFloat(document.getElementById('valor').value),
                regiao: document.getElementById('regiao').value,
                cupom: document.getElementById('cupom').value.trim().toUpperCase()
            };

            try {
                const response = await fetch('/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    resultBox.classList.add('error');
                    resultBox.innerHTML = `Erro: ${data.erro}`;
                } else {
                    resultBox.classList.add('success');
                    resultBox.innerHTML = `
                        <strong>Valor dos Itens:</strong> R$ ${data.valor_carrinho.toFixed(2)}<br>
                        <strong>Custo do Frete:</strong> R$ ${data.frete.toFixed(2)}<br>
                        <hr style="border-top:1px solid #c3e6cb; margin: 10px 0;">
                        <strong>Total a Pagar:</strong> R$ ${data.total.toFixed(2)}
                    `;
                }
            } catch (error) {
                resultBox.classList.add('error');
                resultBox.innerHTML = 'Erro ao conectar com o servidor.';
            }
        });
    </script>
</body>
</html>
